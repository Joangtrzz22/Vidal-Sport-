<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidal Sport | Catálogo Oficial</title>
    <link rel="stylesheet" href="vidal_styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo_vidal.png" alt="Vidal Sport & Auto Sonido" class="main-logo">
        </div>
        <nav>
            <a href="#">Running</a>
            <a href="#">Casual</a>
            <a href="#">Auto Sonido</a>
            <a href="#" class="btn-audio">Audio</a>
        </nav>
    </header>

    <main class="productos-grid">
    <article class="card">
        <span class="tag">ID 1</span>
        <div class="img-zoom" onmousemove="zoomIn(event, 'vidal-img-1')" onmouseleave="zoomOut('vidal-img-1')">
            <img src="tenis1.jpg" id="vidal-img-1" alt="Tenis Vidal Sport">
        </div>
        <div class="info">
             <h3> US W8/ EUR 38/ UK 5 </h3>
                <p class="precio">RD$ 3,500.00</p>
                <button class="btn-comprar">Comprar</button>
        </div>
    </article>

    <article class="card">
        <span class="tag">ID 2</span>
        <div class="img-zoom" onmousemove="zoomIn(event, 'vidal-img-2')" onmouseleave="zoomOut('vidal-img-2')">
            <img src="tenis2.jpg" id="vidal-img-2" alt="Tenis Vidal Casual">
        </div>
        <div class="info">
            <h3>US W7/ EUR 38/ UK 5 </h3>
            <p class="precio">RD$2,500.00</p>
            <button class="btn-comprar">Comprar</button>
        </div>
    </article>
</main>
    </main>

 <script>
    function zoomIn(event, imgId) {
        const img = document.getElementById(imgId);
        const container = event.currentTarget;
        
        const { left, top, width, height } = container.getBoundingClientRect();
        const x = ((event.clientX - left) / width) * 100;
        const y = ((event.clientY - top) / height) * 100;

        img.style.transformOrigin = `${x}% ${y}%`;
        img.style.transform = "scale(2.5)"; 
    }

    function zoomOut(imgId) {
        const img = document.getElementById(imgId);
        img.style.transform = "scale(1)";
        img.style.transformOrigin = "center";
    }
</script>

</body>

</html>
