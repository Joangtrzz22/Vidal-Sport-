<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidal Sport | Catálogo Oficial</title>
    <link rel="stylesheet" href="vidal_styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo_vidal.png" alt="Vidal Sport & Auto Sonido" class="main-logo">
        </div>
        <nav>
            <a href="#">Running</a>
            <a href="#">Casual</a>
            <a href="#">Auto Sonido</a>
            <a href="#" class="btn-audio">Audio</a>
        </nav>
    </header>

    <main class="productos-grid">
        <article class="card">
            <span class="tag">NUEVO</span>
            <div class="img-zoom" onmousemove="zoomIn(event)" onmouseleave="zoomOut()">
                <img src="tenis1.jpg" id="vidal-img" alt="Tenis Vidal Sport">
            </div>
            <div class="info">
                <h3> US W8/ EUR 38/ UK 5 </h3>
                <p class="precio">RD$ 3,500.00</p>
                <button class="btn-comprar">Comprar</button>
            </div>
        </article>
    </main>

    <script>
        function zoomIn(event) {
            const img = document.getElementById("vidal-img");
            const container = event.currentTarget;
            
            // Detecta la posición del cursor dentro del cuadro
            const { left, top, width, height } = container.getBoundingClientRect();
            const x = ((event.clientX - left) / width) * 100;
            const y = ((event.clientY - top) / height) * 100;

            // Mueve el punto de enfoque del zoom hacia el mouse
            img.style.transformOrigin = `${x}% ${y}%`;
            img.style.transform = "scale(2.5)"; 
        }

        function zoomOut() {
            const img = document.getElementById("vidal-img");
            img.style.transform = "scale(1)";
            img.style.transformOrigin = "center";
        }
    </script>

</body>
</html>
